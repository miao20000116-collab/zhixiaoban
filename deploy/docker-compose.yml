# 职小伴 · Oracle Cloud 全栈部署（前端 + 后端 + Postgres + Caddy HTTPS）
# 用法：cp deploy/.env.example deploy/.env  →  填好变量  →  docker compose -f deploy/docker-compose.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_career_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_career_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_career_assistant}
      VECTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_career_assistant}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.deepseek.com/v1}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-flash}
      SPEECH_API_KEY: ${SPEECH_API_KEY:?set SPEECH_API_KEY}
      SPEECH_API_BASE: ${SPEECH_API_BASE:-https://api.siliconflow.cn/v1}
      WHISPER_MODEL: ${WHISPER_MODEL:-FunAudioLLM/SenseVoiceSmall}
      TTS_MODEL: ${TTS_MODEL:-FunAudioLLM/CosyVoice2-0.5B}
      TTS_VOICE: ${TTS_VOICE:-FunAudioLLM/CosyVoice2-0.5B:anna}
      MEDIA_BASE_URL: https://${DOMAIN}/media
      CORS_ORIGINS: https://${DOMAIN}
      LLM_THINKING_ENABLED: ${LLM_THINKING_ENABLED:-false}
      AUDIO_STORAGE_DIR: data/audio
    volumes:
      - audio_data:/app/data/audio

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend-api
        BACKEND_PROXY_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_PROXY_URL: http://backend:8000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  audio_data:
  caddy_data:
  caddy_config:
