# 职小伴前端 · Netlify 部署配置
# 文档：docs/DEPLOY-ORACLE.md（Netlify 前端 + Oracle 后端）

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # 生产后端（Render）；构建时注入，避免前端回退到 /backend-api → localhost
  NEXT_PUBLIC_API_URL = "https://zhixiaoban-api.onrender.com"
  BACKEND_PROXY_URL = "https://zhixiaoban-api.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"
